<form [formGroup]="form" (ngSubmit)="submit()" novalidate class="flex flex-col gap-4">
  @if (error(); as errorKey) {
    <app-error-banner [message]="errorKey" [retryable]="false" />
  }

  <div class="grid gap-4 sm:grid-cols-2">
    <app-field class="sm:col-span-2" label="suppliers.fields.name" for="s-name" [control]="form.controls.name">
      <input pInputText id="s-name" formControlName="name" autocomplete="organization" class="w-full" />
    </app-field>

    <app-field label="suppliers.fields.email" for="s-email" [control]="form.controls.email">
      <input pInputText id="s-email" type="email" formControlName="email" autocomplete="email" dir="ltr" class="w-full" />
    </app-field>

    <app-field label="suppliers.fields.phone" for="s-phone" [control]="form.controls.phone">
      <input pInputText id="s-phone" type="tel" formControlName="phone" autocomplete="tel" dir="ltr" class="w-full" />
    </app-field>

    <app-field label="suppliers.fields.vatNumber" for="s-vat" [control]="form.controls.vatNumber">
      <input pInputText id="s-vat" formControlName="vatNumber" dir="ltr" class="w-full" />
    </app-field>

    <app-field class="sm:col-span-2" label="suppliers.fields.address" for="s-address" [control]="form.controls.address">
      <input pInputText id="s-address" formControlName="address" autocomplete="street-address" class="w-full" />
    </app-field>

    <app-field class="sm:col-span-2" label="suppliers.fields.notes" for="s-notes" [control]="form.controls.notes">
      <textarea pTextarea id="s-notes" rows="3" formControlName="notes" class="w-full"></textarea>
    </app-field>

    @if (isEdit) {
      <label class="flex items-center gap-3 sm:col-span-2" for="s-active">
        <p-toggleswitch inputId="s-active" formControlName="isActive" />
        <span class="text-body">{{ 'suppliers.fields.isActive' | translate }}</span>
      </label>
    }
  </div>

  <div class="flex justify-end gap-2 border-t border-border pt-4">
    <p-button type="button" [label]="'common.cancel' | translate" severity="secondary" [text]="true" [disabled]="saving()" (onClick)="dialogRef.close()" />
    <p-button type="submit" [label]="'common.save' | translate" [loading]="saving()" />
  </div>
</form>
