<form [formGroup]="form" (ngSubmit)="submit()" novalidate class="flex flex-col gap-4">
  @if (error(); as errorKey) {
    <app-error-banner [message]="errorKey" [retryable]="false" />
  }

  <div class="grid gap-4 sm:grid-cols-2">
    <app-field class="sm:col-span-2" label="customers.fields.name" for="c-name" [control]="form.controls.name">
      <input pInputText id="c-name" formControlName="name" autocomplete="organization" class="w-full" />
    </app-field>

    <app-field label="customers.fields.email" for="c-email" [control]="form.controls.email">
      <input pInputText id="c-email" type="email" formControlName="email" autocomplete="email" dir="ltr" class="w-full" />
    </app-field>

    <app-field label="customers.fields.phone" for="c-phone" [control]="form.controls.phone">
      <input pInputText id="c-phone" type="tel" formControlName="phone" autocomplete="tel" dir="ltr" class="w-full" />
    </app-field>

    <app-field label="customers.fields.vatNumber" for="c-vat" [control]="form.controls.vatNumber">
      <input pInputText id="c-vat" formControlName="vatNumber" dir="ltr" class="w-full" />
    </app-field>

    <app-field label="customers.fields.creditLimit" for="c-credit" hint="customers.creditLimitHint" [control]="form.controls.creditLimit">
      <p-inputnumber inputId="c-credit" formControlName="creditLimit" [min]="0" [minFractionDigits]="0" [maxFractionDigits]="2" [suffix]="' ' + currency" locale="en-US" [fluid]="true" />
    </app-field>

    <app-field class="sm:col-span-2" label="customers.fields.address" for="c-address" [control]="form.controls.address">
      <input pInputText id="c-address" formControlName="address" autocomplete="street-address" class="w-full" />
    </app-field>

    <app-field class="sm:col-span-2" label="customers.fields.notes" for="c-notes" [control]="form.controls.notes">
      <textarea pTextarea id="c-notes" rows="3" formControlName="notes" class="w-full"></textarea>
    </app-field>

    @if (isEdit) {
      <label class="flex items-center gap-3 sm:col-span-2" for="c-active">
        <p-toggleswitch inputId="c-active" formControlName="isActive" />
        <span class="text-body">{{ 'customers.fields.isActive' | translate }}</span>
      </label>
    }
  </div>

  <div class="flex justify-end gap-2 border-t border-border pt-4">
    <p-button type="button" [label]="'common.cancel' | translate" severity="secondary" [text]="true" [disabled]="saving()" (onClick)="dialogRef.close()" />
    <p-button type="submit" [label]="'common.save' | translate" [loading]="saving()" />
  </div>
</form>
