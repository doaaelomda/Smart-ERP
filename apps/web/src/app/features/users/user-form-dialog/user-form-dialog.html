<form [formGroup]="form" (ngSubmit)="submit()" novalidate class="flex flex-col gap-4">
  @if (error(); as errorKey) {
    <app-error-banner [message]="errorKey" [retryable]="false" />
  }

  <div class="grid gap-4 sm:grid-cols-2">
    <app-field class="sm:col-span-2" label="users.fields.name" for="u-name" [control]="form.controls.name">
      <input pInputText id="u-name" formControlName="name" autocomplete="name" class="w-full" />
    </app-field>

    <app-field label="users.fields.email" for="u-email" [control]="form.controls.email">
      <input pInputText id="u-email" type="email" formControlName="email" autocomplete="off" dir="ltr" class="w-full" />
    </app-field>

    <app-field label="users.fields.role" for="u-role" [control]="form.controls.roleId">
      <p-select inputId="u-role" formControlName="roleId" [options]="roles()" optionLabel="label" optionValue="_id" appendTo="body" styleClass="w-full" />
    </app-field>

    <app-field class="sm:col-span-2" [label]="isEdit ? 'users.fields.newPassword' : 'users.fields.password'" for="u-password" [control]="form.controls.password">
      <input pInputText id="u-password" type="password" formControlName="password" autocomplete="new-password" dir="ltr" class="w-full" />
    </app-field>

    @if (isEdit) {
      <label class="flex items-center gap-3 sm:col-span-2" for="u-active">
        <p-toggleswitch inputId="u-active" formControlName="isActive" />
        <span class="text-body">{{ 'users.fields.isActive' | translate }}</span>
      </label>
    }
  </div>

  <div class="flex justify-end gap-2 border-t border-border pt-4">
    <p-button type="button" [label]="'common.cancel' | translate" severity="secondary" [text]="true" [disabled]="saving()" (onClick)="dialogRef.close()" />
    <p-button type="submit" [label]="'common.save' | translate" [loading]="saving()" />
  </div>
</form>
